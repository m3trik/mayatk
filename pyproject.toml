[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mayatk"
dynamic = ["version", "readme"]
description = "A comprehensive toolkit for Autodesk Maya providing utilities for modeling, animation, rigging, and UI management."
authors = [{name = "Ryan Simpson", email = "m3trik@outlook.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

# Dependencies - exclude optional system deps (qtpy)
dependencies = [
    # 0.9.25 floor: task_manager.py reads MapOptimizer.SIZE_CLAMP_TEMPLATE in a
    # CLASS BODY, so an older pythontk is an AttributeError at import, not at
    # first use. Also AppSpec.path/.available and the HandoffBridge scratch trio.
    "pythontk>=0.12.0",
    # 1.5.3 floor: every panel's Reset attaches ResetGesture(button) with no
    # state= (older uitk requires it); the Marmoset panel's require_output_dir(mode)
    # has needed >=1.3.85 since before.
    "uitk>=1.6.0",
]

# unitytk is OPTIONAL: it only backs the Unity Bridge panel, for users who take
# exports into Unity and want to extend what ships here. Nothing in mayatk
# imports it at package-import time -- `env_utils/unity_bridge/` resolves
# lazily, so `import mayatk` and every non-Unity feature work without it.
# Install with the extra when you want the bridge:  pip install mayatk[unity]
[project.optional-dependencies]
unity = ["unitytk>=0.0.8"]

[project.urls]
Homepage = "https://github.com/m3trik/mayatk"
Repository = "https://github.com/m3trik/mayatk"

[tool.setuptools.dynamic]
version = {attr = "mayatk.__version__"}
readme = {file = "docs/README.md", content-type = "text/markdown"}

[tool.setuptools.packages.find]
where = ["."]
include = ["mayatk*"]

[tool.setuptools.package-data]
"*" = ["*.ui", "*.json", "*.txt", "*.md", "*.bat", "*.sfx"]

[tool.pytest.ini_options]
# Bare pytest gets the pure-python mocked slice only; the full suite needs the
# Maya runtime and runs via test/run_tests.py (chunked mayapy).
testpaths = ["test/mock_tests"]
pythonpath = [".", "test"]
addopts = "--ignore=test/temp_tests"

[tool.ruff]
# House formatter/linter - rule set, exemptions and gate status: m3trik/docs/CODE_STANDARD.md section 1.
line-length = 88
target-version = "py39"

[tool.ruff.format]
# test/check_cmds_syntax.py holds hand-aligned lookup tables (PLUGIN_CMDS,
# INTERACTIVE_MEL_PROCS) whose trailing comments line up in a column the
# formatter would collapse, and which are read far more often than edited.
# Same rationale as tentacle's docs/parity_map.py. This guards the directory
# walk (`ruff format .`); a path named explicitly on the command line is still
# formatted unless --force-exclude is passed. Lint is unaffected.
exclude = ["test/check_cmds_syntax.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]  # house pattern: try-guarded DCC imports precede the other imports

[tool.ruff.lint.per-file-ignores]
"**/templates/**" = ["F821"]  # exec-templates carry __PLACEHOLDER__ tokens substituted at run time

[tool.m3trik.layers]
# CODE_STANDARD section 0 (Parts): this package's parts, top first; the last is
# the kernel. A part is a package-relative path and the longest declared prefix
# wins, so a tenant can rank above its own folder. A module may import its own
# part or any part below it; "a | b" makes peers of one rank. Checked by
# m3trik/scripts/check_layers.py against a frozen baseline of today's exceptions.
order = [
    "core_utils/diagnostics",
    "core_utils/auto_instancer",
    "anim_utils",
    "rig_utils",
    "nurbs_utils",
    "edit_utils",
    "env_utils",
    "cam_utils",
    "light_utils",
    "uv_utils",
    "mat_utils",
    "audio_utils",
    "display_utils",
    "node_utils",
    "xform_utils",
    "ui_utils",
    "render_utils",
    "core_utils",
]
