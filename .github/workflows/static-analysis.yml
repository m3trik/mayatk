name: Static Analysis

# mayatk's runtime tests require Maya, which isn't available in CI.
# This workflow runs the Maya-free checks: AST parse-walk (catches syntax errors)
# and pyflakes-based static analysis (catches undefined names like unimported `cmds`).

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: AST parse-walk (syntax check, no imports)
        run: |
          python -c "
          import ast, os, sys
          count, failed = 0, []
          for root, _, files in os.walk('mayatk'):
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      try:
                          ast.parse(open(path, encoding='utf-8').read())
                          count += 1
                      except SyntaxError as e:
                          failed.append(f'{path}: {e}')
          print(f'{count} files parsed OK')
          if failed:
              print('SYNTAX ERRORS:')
              for line in failed: print(f'  {line}')
              sys.exit(1)
          "

      - name: pyflakes static analysis
        # Run the test file directly via its __main__ block. Avoids importing
        # mayatk package (which requires pythontk) or test package; only needs
        # stdlib + pyflakes already installed above.
        run: |
          python test/test_static_analysis.py

  api-registry:
    # Content-hash staleness gate for the committed API_INDEX.md /
    # API_REGISTRY.md (root CLAUDE.md documents --check as the CI gate; before
    # this it was wired into no workflow). Its own job because the generator
    # lives in the m3trik repo and expects the monorepo layout - <pkg>/ and
    # m3trik/ as siblings - so the repos are checked out into sibling paths,
    # the same shape tentacle's parity job uses. pythontk is checked out for
    # one stdlib file: it owns the SymbolRecord DTO the generator loads from
    # source (SSoT for the registry's symbol shape).
    #
    # AST-only: no package install, no DCC, no git history. Deterministic in a
    # fresh checkout because --check hashes CONTENT, not mtimes, and normalizes
    # away the generation date and #L line numbers (see StalenessGate) - only a
    # real public-surface delta fails this.
    name: API registry up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: mayatk

      - uses: actions/checkout@v4
        with:
          repository: m3trik/m3trik
          ref: main
          path: m3trik

      - uses: actions/checkout@v4
        with:
          repository: m3trik/pythontk
          ref: dev
          path: pythontk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Registry matches source
        run: python m3trik/scripts/generate_api_registry.py mayatk --check
