name: Static Analysis

# mayatk's runtime tests require Maya, which isn't available in CI.
# This workflow runs the Maya-free checks: AST parse-walk (catches syntax errors)
# and pyflakes-based static analysis (catches undefined names like unimported `cmds`).

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: AST parse-walk (syntax check, no imports)
        run: |
          python -c "
          import ast, os, sys
          count, failed = 0, []
          for root, _, files in os.walk('mayatk'):
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      try:
                          ast.parse(open(path, encoding='utf-8').read())
                          count += 1
                      except SyntaxError as e:
                          failed.append(f'{path}: {e}')
          print(f'{count} files parsed OK')
          if failed:
              print('SYNTAX ERRORS:')
              for line in failed: print(f'  {line}')
              sys.exit(1)
          "

      - name: pyflakes static analysis
        # Run the test file directly via its __main__ block. Avoids importing
        # mayatk package (which requires pythontk) or test package; only needs
        # stdlib + pyflakes already installed above.
        run: |
          python tests/test_static_analysis.py

  api-retirements:
    # A retirement past its window fails: a ptk.Deprecation alias or retired
    # keyword whose remove_in this package's __version__ has reached and whose
    # calendar window has closed (m3trik/scripts/check_api_surface.py). Its own
    # job because the script lives in the m3trik repo and reads with pythontk's
    # ApiSurface, so the repos are checked out as siblings. Source only: no
    # install, no DCC, no git history. Nothing generated is committed: the
    # API is searched live (api.search).
    name: API retirements on time
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: mayatk

      - uses: actions/checkout@v4
        with:
          repository: m3trik/m3trik
          ref: main
          path: m3trik

      - uses: actions/checkout@v4
        with:
          repository: m3trik/pythontk
          ref: dev
          path: pythontk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Retirements on time
        run: python m3trik/scripts/check_api_surface.py mayatk --check

  layer-rules:
    # check_layers.py (m3trik): this package's declared layer order and
    # dependencies, and the product rule -- no library imports tentacle, so
    # each stays usable without it (CODE_STANDARD section 3). AST-only: no
    # install, no DCC.
    name: Layer rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: mayatk

      - uses: actions/checkout@v4
        with:
          repository: m3trik/m3trik
          ref: main
          path: m3trik

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Layer order, dependencies and the product rule
        run: python m3trik/scripts/check_layers.py --check mayatk
