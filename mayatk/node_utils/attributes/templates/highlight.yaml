description: "Per-object highlight: keyable intensity (0-1) plus the colour it glows, for an additive emissive highlight."
attributes:
  - long_name: highlight
    type: float
    keyable: true
    min: 0.0
    max: 1.0
    default: 0.0
  - long_name: highlightColor
    type: float3
    used_as_color: true
    keyable: false
    default: [0.2, 0.5, 1.0]
